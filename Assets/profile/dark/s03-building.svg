<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="03 — building">
  <rect width="1200" height="420" fill="#0d1117"/>
  <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" font-weight="600" letter-spacing="6" fill="#e6edf3">03 — BUILDING</text>
  <line x1="24" y1="60" x2="1176" y2="60" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.15"/>

  <g font-family="ui-monospace, SFMono-Regular, monospace">
    <text x="24" y="115" font-size="14" font-weight="600" fill="#e6edf3" letter-spacing="1">◇  SELF-HOSTED MEDIA BACKUP</text>
    <text x="1176" y="115" text-anchor="end" font-size="11" fill="#8b949e" letter-spacing="2">GO  ·  FLUTTER  ·  SHIZUKU API</text>
    <text x="24" y="142" font-size="13" fill="#8b949e">Turns retired Android phones into a zero-cost private cloud.</text>
    <text x="24" y="162" font-size="13" fill="#8b949e">Full client-server pipeline, on-device with elevated system access.</text>

    <line x1="24" y1="192" x2="1176" y2="192" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.08"/>

    <text x="24" y="222" font-size="14" font-weight="600" fill="#e6edf3" letter-spacing="1">◇  PAYROLL MANAGEMENT SYSTEM</text>
    <text x="1176" y="222" text-anchor="end" font-size="11" fill="#8b949e" letter-spacing="2">C#  ·  .NET  ·  ANGULAR  ·  HANGFIRE</text>
    <text x="24" y="249" font-size="13" fill="#8b949e">Automated pay disbursement on Hangfire background jobs.</text>
    <text x="24" y="269" font-size="13" fill="#8b949e">Real-time attendance and leave-management modules.</text>

    <line x1="24" y1="299" x2="1176" y2="299" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.08"/>

    <text x="24" y="329" font-size="14" font-weight="600" fill="#e6edf3" letter-spacing="1">◇  E-COMMERCE PLATFORM   (LIVE)</text>
    <text x="1176" y="329" text-anchor="end" font-size="11" fill="#8b949e" letter-spacing="2">REACT  ·  FIREBASE  ·  STRIPE</text>
    <text x="24" y="356" font-size="13" fill="#8b949e">Full checkout flow with secure Stripe payment processing.</text>
    <text x="24" y="376" font-size="13" fill="#8b949e">Deployed end to end.</text>
  </g>
